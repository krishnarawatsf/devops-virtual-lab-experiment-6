name: Java CI with Maven

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build & Test Pipeline
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven

    - name: Compile Application
      run: mvn compile

    - name: Run Smoke Tests
      run: mvn test -Dtest=SmokeTest

    - name: Run Unit Tests
      run: mvn test -Dtest=HelloWorldTest

    - name: Run Integration Tests
      run: mvn test -Dtest=IntegrationTest

    - name: Run Regression Tests
      run: mvn test -Dtest=RegressionTest

    - name: Package Application JAR
      run: mvn clean package

    - name: Execute Application Runtime Verification
      run: |
        java -jar target/jenkins-lab-1.0-SNAPSHOT.jar
        java -jar target/jenkins-lab-1.0-SNAPSHOT.jar --smoke
        java -jar target/jenkins-lab-1.0-SNAPSHOT.jar --version
        java -jar target/jenkins-lab-1.0-SNAPSHOT.jar --greet "GitHub Actions CI"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jenkins-lab-jar
        path: target/*.jar
